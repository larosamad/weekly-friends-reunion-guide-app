<safe-area-provider>
  <safe-area-view class="screen">
    <keyboard-avoiding-view [style]="{ flex: 1 }" behavior="padding">
    <scroll-view [style]="{ flex: 1 }" keyboardShouldPersistTaps="handled">
      <view class="body">
        <text class="eyebrow">FRIENDS REUNION</text>
        <text class="title">Il tuo gruppo. </text>

        @if (mode() === 'home') {
          <home-page (startSetup)="mode.set('guide')" (manageBot)="mode.set('manage')" />
        } @else {
          <pressable accessibilityRole="button" [disabled]="editor.busy()" (press)="mode.set('home')"><text class="action">Torna alla home</text></pressable>
          @if (mode() === 'guide') {
            <setup-page (finished)="mode.set('home')" />
          } @else {
            <manage-bot-page />
          }
        }
      </view>
    </scroll-view>
    </keyboard-avoiding-view>
  </safe-area-view>
</safe-area-provider>
